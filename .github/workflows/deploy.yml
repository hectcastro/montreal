name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: jdx/mise-action@v4.2.5

      - name: Lint website
        run: |
          make lint

      - name: Generate website
        run: |
          make build

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./dist"

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-slim
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
